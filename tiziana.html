<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checklist Tiziana – 26 novembre 2026</title><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#eef4fa;color:#17334f;margin:0;padding:16px}main{max-width:720px;margin:auto}header,section,.panel{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #17334f12}h1{margin:0;font-size:28px}h2{font-size:19px;color:#175b94;margin:0 0 12px}label{display:flex;gap:12px;padding:14px 0;border-top:1px solid #e2eaf2;align-items:flex-start;line-height:1.5}input{width:23px;height:23px;flex:none;accent-color:#1769a5}input:checked+span{text-decoration:line-through;color:#64748b}progress{width:100%;height:18px;accent-color:#1769a5}button{border:0;border-radius:9px;padding:12px;margin:5px 3px;background:#1769a5;color:white;font:inherit}small{color:#47627b}@media print{button{display:none}body{background:white}}</style></head><body><main><header><small>STUDIO ODONTOIATRICO · ASO</small><h1>Checklist Tiziana</h1><p>Giovedì 26 novembre 2026</p><strong>Turno 10:00–18:00</strong><p>Apertura 08:30: Elisa · Chiusura 19:00: Lorella. Nessuna procedura di apertura o chiusura a carico di Tiziana.</p></header><div class="panel"><strong id="count">0 / 10 attività</strong><progress id="bar" value="0" max="10"></progress></div><section><h2>Assistenza clinica · 10:00–18:00</h2><label><input type="checkbox" id="t1"><span>Assistere principalmente la Dott.ssa Giulia Stori, alternandosi con Elisa per la Dott.ssa Chiara Pennacchioni quando necessario.</span></label><label><input type="checkbox" id="t2"><span>Preparare i servomobili con materiali di conservativa e protesi per la Dott.ssa Stori.</span></label><label><input type="checkbox" id="t3"><span>Verificare sul PC eventuali preferenze del paziente.</span></label><label><input type="checkbox" id="t4"><span>Accogliere i pazienti per nome, far compilare o firmare consensi e anamnesi sul tablet e notificare l’arrivo tramite Alexa.</span></label><label><input type="checkbox" id="t5"><span>Riordinare la sala tra i pazienti (5–8 minuti per riordino semplice, 8–15 per casi complessi): smaltire i monouso, decontaminare e disinfettare con ECster o Mikrozid, sostituire le barriere.</span></label><label><input type="checkbox" id="t6"><span>Decontaminare e lavare lo strumentario ad ultrasuoni.</span></label><label><input type="checkbox" id="t7"><span>Asciugare perfettamente, imbustare con data e iniziali ed eseguire il ciclo in autoclave Lina.</span></label><label><input type="checkbox" id="t8"><span>Verificare su AlfaDocs le prestazioni marcate come eseguite e le note complete (dente, anestesia, materiali, operatori).</span></label></section><section><h2>Rifiuti del giovedì</h2><label><input type="checkbox" id="t9"><span>Schiacciare carta e cartone e lasciare il contenitore pronto per la raccolta serale. Non esporlo all’esterno.</span></label></section><section><h2>Fine turno · 18:00</h2><label><input type="checkbox" id="t10"><span>Effettuare il passaggio delle consegne cliniche prima di uscire.</span></label></section><div class="panel"><button id="wa">Riepilogo WhatsApp</button><button onclick="window.print()">Stampa</button><button id="reset">Azzera spunte</button></div></main><script>const boxes=[...document.querySelectorAll('input[type=checkbox]')],key='tiziana-2026-11-26';try{const saved=JSON.parse(localStorage.getItem(key)||'[]');boxes.forEach((b,i)=>b.checked=!!saved[i])}catch(e){}function update(){const n=boxes.filter(b=>b.checked).length;document.getElementById('count').textContent=n+' / '+boxes.length+' attività';document.getElementById('bar').value=n;try{localStorage.setItem(key,JSON.stringify(boxes.map(b=>b.checked)))}catch(e){}}boxes.forEach(b=>b.addEventListener('change',update));update();document.getElementById('reset').onclick=()=>{if(confirm('Azzerare tutte le spunte?')){boxes.forEach(b=>b.checked=false);update()}};document.getElementById('wa').onclick=()=>{const msg='Checklist Tiziana – 26/11/2026\n'+document.getElementById('count').textContent+'\n'+boxes.map(b=>(b.checked?'✅ ':'⬜ ')+b.nextElementSibling.textContent).join('\n');window.location.href='https://wa.me/?text='+encodeURIComponent(msg)};</script></body></html>
