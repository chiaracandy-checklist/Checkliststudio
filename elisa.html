<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checklist Elisa – 25 novembre 2026</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;background:#eef4fa;color:#17334e;margin:0}main{max-width:760px;margin:auto;padding:16px}header,section,.progress{background:white;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #1232}h1{margin:0;color:#12548a;font-size:27px}h2{font-size:19px;color:#12548a;margin:0 0 12px}p{margin:8px 0}label{display:flex;gap:12px;padding:13px 0;border-top:1px solid #e1e9f0;align-items:flex-start}input{width:23px;height:23px;flex:none;accent-color:#1767a6}input:checked+span{color:#60758a;text-decoration:line-through}progress{width:100%;height:16px;accent-color:#1767a6}button{background:#1767a6;color:white;border:0;border-radius:9px;padding:12px;margin:4px;font:inherit} @media print{button{display:none}body{background:white}section{box-shadow:none}}</style></head><body><main><header><h1>Checklist Elisa</h1><p>Mercoledì 25 novembre 2026</p><strong>Turno 10:00–18:00</strong><p>Apertura 08:30: Tiziana · Chiusura 19:00: Lorella</p></header><div class="progress"><strong id="count">0 / 16 attività</strong><progress id="bar" max="16" value="0"></progress></div><section><h2>Filtro generale – garage (10 min)</h2><label><input type="checkbox" id="t1"><span>Prelevare il contenitore bianco con il filtro giallo pulito sotto il lavello in sterilizzazione e le chiavi con il panda sul tavolo della reception.</span></label><label><input type="checkbox" id="t2"><span>Scendere nella seconda stanza della sala macchine: macchinario sospeso in alto a destra. Spegnere l’interruttore generale grigio in alto a destra.</span></label><label><input type="checkbox" id="t3"><span>Svitare il filtro giallo sporco, avvitare a fondo quello pulito e riaccendere il macchinario.</span></label><label><input type="checkbox" id="t4"><span>Lavare il filtro sporco in sterilizzazione con acqua corrente, spazzolino e detersivo per piatti.</span></label><label><input type="checkbox" id="t5"><span>Asciugare il filtro, risciacquare il lavello e riporre il filtro nella scatola bianca sotto il lavello.</span></label></section><section><h2>Bagni e scorte monouso</h2><label><input type="checkbox" id="t6"><span>Bagno pazienti: controllare salviette grandi (armadio bagno personale) e spazzolini Happy Morning (armadio corridoio, prima e seconda anta a destra).</span></label><label><input type="checkbox" id="t7"><span>Bagno personale: controllare e rifornire il dispenser delle salviette grandi.</span></label><label><input type="checkbox" id="t8"><span>Studi operativi: controllare le salviette piccole usando la chiavetta plastificata.</span></label><label><input type="checkbox" id="t9"><span>Reception e studi: controllare i bicchieri monouso (armadio bagno personale, ripiano in alto a destra).</span></label><label><input type="checkbox" id="t10"><span>Segnalare a Greta Valentino eventuali scorte in esaurimento per il prossimo ordine.</span></label></section><section><h2>Assistenza clinica e sterilizzazione</h2><label><input type="checkbox" id="t11"><span>Alternarsi con Tiziana nell’assistenza alla Dott.ssa Chiara e al Dott. Mastropierro, se presente nel turno bisettimanale.</span></label><label><input type="checkbox" id="t12"><span>Tra i pazienti (5–15 min): sgomberare i rifiuti monouso, decontaminare e disinfettare le superfici con DPI e prodotti idonei, sostituire le barriere.</span></label><label><input type="checkbox" id="t13"><span>Decontaminare e lavare a ultrasuoni lo strumentario, asciugare accuratamente, imbustare e sterilizzare in autoclave.</span></label><label><input type="checkbox" id="t14"><span>Verificare su AlfaDocs che ogni prestazione sia marcata come eseguita con nota clinica completa.</span></label></section><section><h2>Rifiuti e fine turno</h2><label><input type="checkbox" id="t15"><span>Prima delle 18:00 verificare che il contenitore del secco indifferenziato sia ben chiuso e pronto. Lorella lo espone alle 19:00.</span></label><label><input type="checkbox" id="t16"><span>Alle 18:00 terminare il turno e passare le consegne. Nessuna chiusura dello studio.</span></label></section><button onclick="share()">Riepilogo WhatsApp</button><button onclick="window.print()">Stampa</button><button onclick="resetAll()">Azzera spunte</button></main><script>const boxes=[...document.querySelectorAll('input[type=checkbox]')],key='elisa-2026-11-25';function update(){const n=boxes.filter(b=>b.checked).length;document.getElementById('count').textContent=n+' / '+boxes.length+' attività';document.getElementById('bar').value=n;try{localStorage.setItem(key,JSON.stringify(boxes.map(b=>b.checked)))}catch(e){}}try{const saved=JSON.parse(localStorage.getItem(key)||'[]');boxes.forEach((b,i)=>b.checked=!!saved[i])}catch(e){}boxes.forEach(b=>b.addEventListener('change',update));update();function resetAll(){if(confirm('Azzerare tutte le spunte?')){boxes.forEach(b=>b.checked=false);update()}}function share(){const msg='Checklist Elisa – 25/11/2026\n'+document.getElementById('count').textContent+'\n'+boxes.map(b=>(b.checked?'✓ ':'☐ ')+b.nextElementSibling.textContent).join('\n');window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}</script></body></html>
