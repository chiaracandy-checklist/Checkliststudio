<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist Elisa – 26 novembre 2026</title><style> *{box-sizing:border-box}body{margin:0;background:#eef4fa;color:#17324d;font:16px/1.5 -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:760px;margin:auto;padding:16px}header{background:#164d80;color:white;border-radius:18px;padding:22px}h1{margin:0;font-size:28px}h2{font-size:18px;color:#164d80;margin:0 0 10px}section,.panel{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #16324d0c}label{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #e5edf5}label:last-child{border:0}input{width:23px;height:23px;flex-shrink:0;accent-color:#1766a6;margin:2px 0}input:checked+span{color:#64748b;text-decoration:line-through}progress{width:100%;height:16px;accent-color:#1766a6}button{border:0;border-radius:9px;padding:12px;margin:5px 3px;background:#164d80;color:white;font-size:15px}small{display:block} @media print{button{display:none}section{break-inside:avoid}}</style></head><body><main><header><small>CHECKLIST OPERATIVA • ASO</small><h1>Elisa</h1><div>Giovedì 26 novembre 2026</div><strong>08:30–16:30</strong><div>Apertura: Elisa • Chiusura 19:00: Lorella</div></header><div class="panel"><strong id="count">0 / 17 attività</strong><progress id="bar" value="0" max="17"></progress><div><button onclick="share()">Riepilogo WhatsApp</button><button onclick="window.print()">Stampa</button><button onclick="resetTasks()">Azzera</button></div></div><section><h2>Apertura dello studio • 08:30</h2><label><input type="checkbox" id="t1"><span>Disinserire l’allarme con il telecomando: verificare il passaggio della spia da verde a rossa e aprire la porta principale con le chiavi.</span></label><label><input type="checkbox" id="t2"><span>Accendere le luci di ingresso, corridoio e sale operative.</span></label><label><input type="checkbox" id="t3"><span>Attivare la ciabatta all’ingresso (totem luminoso ed erogatore d’acqua).</span></label><label><input type="checkbox" id="t4"><span>Aprire tutti gli scuri.</span></label><label><input type="checkbox" id="t5"><span>Alzare le ultime tre leve a destra nei quadri elettrici di ogni studio. Fondamentale: studio rosso, anche se non utilizzato, per garantire l’acqua in tutta la struttura.</span></label><label><input type="checkbox" id="t6"><span>Accendere PC e stampante Brother; avviare AlfaDocs.</span></label><label><input type="checkbox" id="t7"><span>Attivare la TV in sala d’attesa (video USB) e la musica rilassante.</span></label><label><input type="checkbox" id="t8"><span>Accendere l’autoclave Lina ed eseguire il Vacuum Test quotidiano a camera vuota.</span></label><label><input type="checkbox" id="t9"><span>Registrare manualmente l’esito del Vacuum Test nel quadernone dedicato.</span></label><label><input type="checkbox" id="t10"><span>Accendere i riuniti tramite la levetta Master sulla faretra.</span></label></section><section><h2>Assistenza clinica • 08:30–16:30</h2><label><input type="checkbox" id="t11"><span>Assistere principalmente la Dott.ssa Chiara Pennacchioni; alternarsi se necessario con Tiziana, che assiste la Dott.ssa Giulia Stori.</span></label><label><input type="checkbox" id="t12"><span>Accogliere i pazienti per nome, verificare consensi e anamnesi sul tablet e notificare l’arrivo tramite Alexa.</span></label><label><input type="checkbox" id="t13"><span>Riordinare le sale tra i pazienti: eliminare i monouso, decontaminare e disinfettare con ECster o Mikrozid, sostituire le barriere. Tempi: 5–8 min per riordino semplice, 8–15 min per interventi complessi.</span></label><label><input type="checkbox" id="t14"><span>Gestire decontaminazione, lavaggio a ultrasuoni, asciugatura perfetta, imbustamento con data e iniziali e ciclo in autoclave Lina.</span></label><label><input type="checkbox" id="t15"><span>Verificare su AlfaDocs che ogni prestazione sia marcata come eseguita con nota clinica completa (dente, anestesia, materiali, operatori).</span></label></section><section><h2>Rifiuti del giovedì</h2><label><input type="checkbox" id="t16"><span>Schiacciare le scatole di carta e cartone e lasciare il contenitore pronto e ordinato. L’esposizione esterna spetta a chi chiude alle 19:00.</span></label></section><section><h2>Fine turno • 16:30</h2><label><input type="checkbox" id="t17"><span>Effettuare il passaggio di consegne a Lorella. Non effettuare la chiusura serale.</span></label></section></main><script>const key='checklist-elisa-2026-11-26';const boxes=[...document.querySelectorAll('input[type=checkbox]')];try{const saved=JSON.parse(localStorage.getItem(key)||'{}');boxes.forEach(b=>b.checked=!!saved[b.id])}catch(e){}function update(){let done=boxes.filter(b=>b.checked).length;document.getElementById('count').textContent=done+' / '+boxes.length+' attività';document.getElementById('bar').value=done;try{localStorage.setItem(key,JSON.stringify(Object.fromEntries(boxes.map(b=>[b.id,b.checked]))))}catch(e){}}boxes.forEach(b=>b.addEventListener('change',update));function resetTasks(){if(confirm('Azzerare tutte le spunte?')){boxes.forEach(b=>b.checked=false);update()}}function share(){let msg='Checklist Elisa – 26 novembre 2026\n'+document.getElementById('count').textContent+'\n'+boxes.map(b=>(b.checked?'✓ ':'☐ ')+b.nextElementSibling.textContent).join('\n');window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}update();</script></body></html>
